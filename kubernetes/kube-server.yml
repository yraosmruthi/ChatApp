apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatapp-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatapp-backend
  template:
    metadata:
      labels:
        app: chatapp-backend
    spec:
      containers:
        - name: chatapp-backend
          image: smruthiy04/chatapp-server:latest
          ports:
            - containerPort: 3000


---
apiVersion: v1
kind: Service
metadata:
  name: chatapp-backend
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: chatapp-backend
  type: ClusterIP