apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatapp-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatapp-frontend
  template:
    metadata:
      labels:
        app: chatapp-frontend
    spec:
      containers:
        - name: chatapp-frontend
          image: smruthiy04/chatapp-client:latest
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: chatapp-frontend
spec:
  selector:
    app: chatapp-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      
  type: ClusterIP